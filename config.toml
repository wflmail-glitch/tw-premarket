# 台股盤前整理 設定檔
# 要換觀察清單，改這裡就好（不用動程式）

[watchlist]
# 額外觀察（非持股）：大盤參考
etfs = ["0050"]
stocks = []

# 我的持股（來源：券商庫存截圖 2026-10-16；美德醫療-DR 已於 10/16 賣出）
# 股數、成本均價改這裡；type: etf（交易稅 0.1%）、stock（0.3%）、dr（存託憑證 0.1%）
[[holdings]]
code = "00406A"
name = "主動中信台灣收益"
shares = 40000
cost = 9.4835   # 成本待確認：截圖為 20,000 股時的均價，加碼後均價請更新
type = "etf"

[[holdings]]
